<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — Open-World Crime Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2b705'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='Georgia,serif' font-weight='bold' fill='%23241f18'%3ES%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14100a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #frame {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: auto;
    cursor: crosshair;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(242, 183, 5, 0.12);
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
