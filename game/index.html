<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Solara Bay — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c1018; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #7fae62; }
  #status { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Solara Bay game canvas"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
